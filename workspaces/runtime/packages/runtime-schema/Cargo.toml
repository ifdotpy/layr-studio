[package]
name = "studio-runtime-schema"
version.workspace = true
edition.workspace = true
description = "Compiled schemas and shared runtime contracts"
license.workspace = true
publish.workspace = true

[dependencies]
studio-client-domain = { path = "../../../client/packages/client-domain" }
studio-request-signing = { path = "../request-signing" }
schemars.workspace = true
data-encoding = { workspace = true }
jsonschema = { workspace = true }
regex.workspace = true
serde = { workspace = true }
studio-json = { path = "../json" }
sha2 = { workspace = true }
strum.workspace = true
unicode-general-category.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[build-dependencies]
openapi-to-rust = { version = "=0.22.0", default-features = false }
syn = { version = "=2.0.119", features = ["full", "extra-traits"] }
studio-json = { path = "../json" }
studio-client-domain = { path = "../../../client/packages/client-domain" }

[features]
perf-reporting = []
sqlite = ["dep:rusqlite"]

[lints]
workspace = true
