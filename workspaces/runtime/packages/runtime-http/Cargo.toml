[package]
autotests = false
name = "studio-runtime-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
axum = { workspace = true }
brotli = { workspace = true }
inventory = { workspace = true }
form_urlencoded = { workspace = true }
jsonschema = { workspace = true }
futures-util = { workspace = true }
rusqlite = { workspace = true }
http-range-header = { workspace = true }
studio-json = { path = "../json" }
serde = { workspace = true, features = ["derive"] }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
flate2 = "=1.1.10"
tempfile = { workspace = true }
studio-runtime-process = { path = "../runtime-process" }
studio-runtime-providers = { path = "../runtime-providers" }
studio-runtime-services = { path = "../runtime-services" }
studio-runtime-schema = { path = "../runtime-schema" }
studio-runtime-store = { path = "../runtime-store" }
subtle = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tower-http = { workspace = true, features = ["compression-br"] }
tracing = "=0.1.44"
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
gungraun = "=0.17.2"
studio-runtime-services = { path = "../runtime-services", features = ["test-support"] }
studio-runtime-store = { path = "../runtime-store", features = ["test-support"] }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench-support"]

[features]
bench-support = []
perf-reporting = ["studio-runtime-store/perf-reporting", "studio-runtime-services/perf-reporting"]
