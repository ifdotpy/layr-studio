[package]
name = "studio-request-signing"
version.workspace = true
edition.workspace = true
description = "Owner of the multi-server request signature: canonical bytes, header names, Ed25519 sign and verify"
license.workspace = true
publish.workspace = true

[features]
default = ["ed25519"]
# Sign and verify. The browser build (client-wasm) turns it off: it only needs the bytes.
ed25519 = ["dep:ring"]

[dependencies]
base64 = { workspace = true }
ring = { workspace = true, optional = true }
sha2 = { workspace = true }

[lints]
workspace = true
