[package]
name = "layr-retest"
version = "0.1.0"
edition = "2021"
description = "Run only the tests that a change can affect, on top of the layr CLI"
license = "MIT"
publish = false
autobins = false

[lib]
# Renamed to src/lib.rs once the changes to main.rs in open PRs are merged.
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
