[package]
autotests = false
name = "studio-process-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codex-process-supervisor"
path = "src/main.rs"

[dependencies]
studio-runtime-process = { path = "../../packages/runtime-process" }
tokio.workspace = true

[dev-dependencies]
notify.workspace = true
rusqlite.workspace = true
studio-runtime-store = { path = "../../packages/runtime-store", features = ["test-support"] }
studio-json = { path = "../../packages/json" }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["param"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
studio-runtime-proc-sys = { path = "../../packages/runtime-proc-sys" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
