<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="LAYR Studio" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LAYR Studio</title>
    <!-- The first paint before the bundle: the same OLED black or light page,
         Geist stack and spinner as the application (studio-theme.css). -->
    <style>
      :root {
        color-scheme: dark light;
        --boot-page: #000000;
        --boot-text: #ededed;
        --boot-muted: #a1a1a1;
        --boot-line: #3d3d3d;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --boot-page: #fafafa;
          --boot-text: #171717;
          --boot-muted: #666666;
          --boot-line: #d4d4d4;
        }
      }
      body:has(.studio-startup) {
        margin: 0;
        background: var(--boot-page);
      }
      .studio-startup {
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        padding: 24px;
        margin: 0;
        background: var(--boot-page);
        color: var(--boot-muted);
        font:
          13px/1.5 "Geist",
          system-ui,
          -apple-system,
          sans-serif;
        letter-spacing: -0.01em;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .studio-startup p {
        margin: 0;
      }
      .studio-startup::before {
        content: "";
        width: 16px;
        height: 16px;
        border: 1.5px solid var(--boot-line);
        border-top-color: var(--boot-text);
        border-radius: 50%;
        animation: studio-boot-spin 0.8s linear infinite;
      }
      /* Help and the reload link appear only once opening is slow. */
      .studio-startup:not([data-slow]) :is(#studio-startup-help, a) {
        display: none;
      }
      .studio-startup[data-slow]::before {
        display: none;
      }
      .studio-startup[data-slow] #studio-startup-status {
        color: var(--boot-text);
      }
      .studio-startup a {
        color: var(--boot-text);
      }
      @keyframes studio-boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .studio-startup::before {
          animation: none;
        }
      }
    </style>
    <script src="/studio-startup.js" defer></script>
    <link rel="icon" type="image/png" href="/src/assets/codex-studio.png" />
  </head>
  <body>
    <div id="root">
      <main class="studio-startup" aria-label="Studio startup">
        <p role="status" id="studio-startup-status">Opening Studio…</p>
        <p id="studio-startup-help">Connecting to your computer.</p>
        <p><a href="/">Reload Studio</a></p>
        <noscript>Enable JavaScript to open Studio.</noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
