id: rust-json-value-roundtrip
language: Rust
message: Construct the owned value directly instead of serializing and deserializing JSON.
severity: warning
rule:
  any:
    - pattern: studio_json::from_value(json!($$$ARGS))
    - pattern: studio_json::from_value(studio_json::json!($$$ARGS))
    - pattern: studio_json::from_value(studio_json::to_value($$$ARGS)?)
    - pattern: studio_json::from_value(studio_json::to_value($$$ARGS).unwrap())
