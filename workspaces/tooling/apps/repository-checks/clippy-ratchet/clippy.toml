# Inherited test convention owned by the root clippy.toml.
allow-unwrap-in-tests = true

# Blocking work has one entry point: `studio_runtime_store::blocking_pool::spawn_blocking`
# (re-exported as `studio_runtime_process::blocking_pool`), which labels every call site.
# Runtime::block_on is reserved for rare synchronous runtime entry points; banning it
# would also flag every tokio::test expansion, so audit its production callers directly.
disallowed-methods = [
  { path = "rusqlite::Connection::execute", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::execute_batch", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::query_row", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::query_one", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::query_row_and_then", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::prepare", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::prepare_cached", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::prepare_with_flags", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::pragma_query_value", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::pragma_query", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::pragma", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::pragma_update", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Connection::pragma_update_and_check", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::execute", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::query", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::query_map", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::query_and_then", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::query_row", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::query_one", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::raw_execute", reason = "sql-inventory: use a typed adapter" },
  { path = "rusqlite::Statement::raw_query", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::query", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::project", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::project_one", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::scalar", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::scalars", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::scalar_raw", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Read::exists", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Tx::execute", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Tx::query", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_db_api::query::Tx::update", reason = "sql-inventory: use a typed adapter" },
  { path = "studio_json::from_value", reason = "prefer typed deserialization" },
  { path = "studio_json::to_value", reason = "prefer typed serialization" },
  { path = "std::fs::canonicalize", reason = "use studio_runtime_store::path_identity typed constructors; the sole host path identity owner" },
  { path = "std::path::Path::canonicalize", reason = "use studio_runtime_store::path_identity typed constructors; the sole host path identity owner" },
  { path = "tokio::fs::canonicalize", reason = "use studio_runtime_store::path_identity typed constructors; the sole host path identity owner" },
  { path = "tokio::task::spawn_blocking", reason = "use blocking_pool::spawn_blocking with a call-site label" },
  { path = "tokio::runtime::Handle::spawn_blocking", reason = "use blocking_pool::spawn_blocking with a call-site label" },
  { path = "std::thread::sleep", reason = "use tokio::time::sleep, or document the dedicated blocking thread" },
  { path = "futures_executor::block_on", reason = "await the future on Tokio instead of blocking a runtime thread" },
  { path = "tokio::runtime::Handle::block_on", reason = "await the future; only dedicated non-Tokio threads may block" },
  { path = "std::process::Command::output", reason = "use bounded_child or tokio::process with a deadline and output bound" },
  { path = "std::process::Command::status", reason = "use bounded_child or tokio::process with a deadline" },
  # HTTP-only blocking filesystem guards.
  { path = "std::fs::copy", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::create_dir", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::create_dir_all", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::exists", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::hard_link", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::read", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::read_dir", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::read_link", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::read_to_string", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::remove_dir", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::remove_dir_all", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::remove_file", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::rename", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::set_permissions", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::soft_link", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::symlink_metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::write", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::open", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::create", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::create_new", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::options", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::set_len", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::set_permissions", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::sync_all", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::File::sync_data", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::OpenOptions::open", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::DirBuilder::create", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::DirEntry::metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::fs::DirEntry::file_type", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::exists", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::is_dir", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::is_file", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::is_symlink", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::read_dir", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::read_link", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::symlink_metadata", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "std::path::Path::try_exists", reason = "HTTP handlers must use tokio::fs or labeled blocking_pool::spawn_blocking" },
  { path = "jsonschema::ValidationOptions::build", reason = "HTTP handlers must use studio_runtime_schema::compiled_validator; only inline request parts and DraftPayload compile locally" },
  { path = "jsonschema::ValidationOptions::build_map", reason = "HTTP handlers must use studio_runtime_schema::compiled_validator; build_map creates separate compiler contexts" },
]

# Maximum inline future size in bytes; larger futures must be boxed at their owner.
future-size-threshold = 16384

# Opt-in with clippy::disallowed_types on closed typed owners only.
disallowed-types = [{ path = "serde_json::Value", reason = "closed typed owners must not accept unstructured JSON" }]
